<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Fire — a small, statically typed language and the compiler that runs it">
  <title>Fire</title>
  <defs>
    <linearGradient id="ember" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0%" stop-color="#F4511E"/>
      <stop offset="55%" stop-color="#FF8A1F"/>
      <stop offset="100%" stop-color="#FFC64B"/>
    </linearGradient>
    <linearGradient id="emberSoft" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#F4511E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFC64B" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.16" cy="0.72" r="0.6">
      <stop offset="0%" stop-color="#FF7A18" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FF7A18" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="0.8" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#FFB347" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFB347" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground -->
  <rect width="1280" height="340" rx="14" fill="#0B0D11"/>
  <rect width="1280" height="340" rx="14" fill="url(#glow)"/>
  <rect width="1280" height="340" rx="14" fill="url(#glowRight)"/>
  <rect x="0.5" y="0.5" width="1279" height="339" rx="14" fill="none" stroke="#1E232B"/>

  <!-- flame mark: three geometric tongues -->
  <g transform="translate(74 92)">
    <path d="M34 0 C34 24 58 32 58 62 C58 84 47 98 34 98 C21 98 10 84 10 62 C10 40 26 34 34 0 Z"
          fill="url(#ember)"/>
    <path d="M34 40 C34 54 45 58 45 72 C45 84 40 92 34 92 C28 92 23 84 23 72 C23 58 31 54 34 40 Z"
          fill="#0B0D11" opacity="0.55"/>
  </g>

  <!-- wordmark -->
  <text x="164" y="176"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="112" font-weight="700" letter-spacing="8" fill="url(#ember)">FIRE</text>

  <!-- tagline -->
  <text x="168" y="214"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="21" fill="#C9D1D9" letter-spacing="0.2">A small, statically typed language.</text>

  <!-- pipeline caption -->
  <text x="168" y="244"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" fill="#7D8590" letter-spacing="0.5">lexer → parser → types → bytecode VM → x86-64</text>

  <!-- badges -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <rect x="168" y="266" width="72" height="26" rx="13" fill="#161B22" stroke="#2A313B"/>
    <text x="204" y="283" fill="#FF8A1F" text-anchor="middle">.fire</text>
    <rect x="250" y="266" width="72" height="26" rx="13" fill="#161B22" stroke="#2A313B"/>
    <text x="286" y="283" fill="#8B949E" text-anchor="middle">C++20</text>
    <rect x="332" y="266" width="98" height="26" rx="13" fill="#161B22" stroke="#2A313B"/>
    <text x="381" y="283" fill="#8B949E" text-anchor="middle">zero deps</text>
    <rect x="440" y="266" width="82" height="26" rx="13" fill="#161B22" stroke="#2A313B"/>
    <text x="481" y="283" fill="#8B949E" text-anchor="middle">MIT</text>
  </g>

  <!-- right panel: source lines resolving into bytecode cells -->
  <g transform="translate(742 62)">
    <rect x="-14" y="-14" width="510" height="240" rx="12" fill="#0E1116" stroke="#1B212A"/>

    <!-- ragged source lines on the left of the panel -->
    <g fill="url(#emberSoft)">
      <rect x="8"  y="10"  width="132" height="9" rx="4.5" opacity="0.95"/>
      <rect x="8"  y="34"  width="96"  height="9" rx="4.5" opacity="0.85"/>
      <rect x="24" y="58"  width="118" height="9" rx="4.5" opacity="0.75"/>
      <rect x="24" y="82"  width="72"  height="9" rx="4.5" opacity="0.65"/>
      <rect x="8"  y="106" width="110" height="9" rx="4.5" opacity="0.55"/>
      <rect x="8"  y="130" width="140" height="9" rx="4.5" opacity="0.45"/>
      <rect x="24" y="154" width="84"  height="9" rx="4.5" opacity="0.35"/>
      <rect x="8"  y="178" width="120" height="9" rx="4.5" opacity="0.25"/>
    </g>

    <!-- flow lines -->
    <g stroke="#FF8A1F" stroke-width="1.1" fill="none" opacity="0.35">
      <path d="M162 15 C216 15 216 40 268 40"/>
      <path d="M162 39 C216 39 216 64 268 64"/>
      <path d="M162 63 C216 63 216 88 268 88"/>
      <path d="M162 87 C216 87 216 112 268 112"/>
      <path d="M162 111 C216 111 216 136 268 136"/>
      <path d="M162 135 C216 135 216 160 268 160"/>
    </g>

    <!-- ordered bytecode grid -->
    <g fill="#FF8A1F">
      <g opacity="0.9">
        <rect x="280" y="8"   width="18" height="18" rx="4"/>
        <rect x="304" y="8"   width="18" height="18" rx="4" opacity="0.45"/>
        <rect x="328" y="8"   width="18" height="18" rx="4" opacity="0.45"/>
        <rect x="352" y="8"   width="18" height="18" rx="4" opacity="0.2"/>
        <rect x="376" y="8"   width="18" height="18" rx="4" opacity="0.2"/>
        <rect x="400" y="8"   width="18" height="18" rx="4" opacity="0.2"/>
        <rect x="424" y="8"   width="18" height="18" rx="4" opacity="0.45"/>
        <rect x="448" y="8"   width="18" height="18" rx="4" opacity="0.2"/>
      </g>
      <g opacity="0.8">
        <rect x="280" y="32"  width="18" height="18" rx="4"/>
        <rect x="304" y="32"  width="18" height="18" rx="4" opacity="0.2"/>
        <rect x="328" y="32"  width="18" height="18" rx="4" opacity="0.45"/>
        <rect x="352" y="32"  width="18" height="18" rx="4" opacity="0.2"/>
        <rect x="376" y="32"  width="18" height="18" rx="4" opacity="0.45"/>
        <rect x="400" y="32"  width="18" height="18" rx="4" opacity="0.2"/>
        <rect x="424" y="32"  width="18" height="18" rx="4" opacity="0.2"/>
        <rect x="448" y="32"  width="18" height="18" rx="4" opacity="0.45"/>
      </g>
      <g opacity="0.7">
        <rect x="280" y="56"  width="18" height="18" rx="4"/>
        <rect x="304" y="56"  width="18" height="18" rx="4" opacity="0.45"/>
        <rect x="328" y="56"  width="18" height="18" rx="4" opacity="0.2"/>
        <rect x="352" y="56"  width="18" height="18" rx="4" opacity="0.45"/>
        <rect x="376" y="56"  width="18" height="18" rx="4" opacity="0.2"/>
        <rect x="400" y="56"  width="18" height="18" rx="4" opacity="0.45"/>
        <rect x="424" y="56"  width="18" height="18" rx="4" opacity="0.2"/>
        <rect x="448" y="56"  width="18" height="18" rx="4" opacity="0.2"/>
      </g>
      <g opacity="0.55">
        <rect x="280" y="80"  width="18" height="18" rx="4"/>
        <rect x="304" y="80"  width="18" height="18" rx="4" opacity="0.2"/>
        <rect x="328" y="80"  width="18" height="18" rx="4" opacity="0.2"/>
        <rect x="352" y="80"  width="18" height="18" rx="4" opacity="0.45"/>
        <rect x="376" y="80"  width="18" height="18" rx="4" opacity="0.2"/>
        <rect x="400" y="80"  width="18" height="18" rx="4" opacity="0.2"/>
        <rect x="424" y="80"  width="18" height="18" rx="4" opacity="0.45"/>
        <rect x="448" y="80"  width="18" height="18" rx="4" opacity="0.2"/>
      </g>
      <g opacity="0.4">
        <rect x="280" y="104" width="18" height="18" rx="4"/>
        <rect x="304" y="104" width="18" height="18" rx="4" opacity="0.45"/>
        <rect x="328" y="104" width="18" height="18" rx="4" opacity="0.2"/>
        <rect x="352" y="104" width="18" height="18" rx="4" opacity="0.2"/>
        <rect x="376" y="104" width="18" height="18" rx="4" opacity="0.45"/>
        <rect x="400" y="104" width="18" height="18" rx="4" opacity="0.2"/>
        <rect x="424" y="104" width="18" height="18" rx="4" opacity="0.2"/>
        <rect x="448" y="104" width="18" height="18" rx="4" opacity="0.45"/>
      </g>
      <g opacity="0.28">
        <rect x="280" y="128" width="18" height="18" rx="4"/>
        <rect x="304" y="128" width="18" height="18" rx="4" opacity="0.4"/>
        <rect x="328" y="128" width="18" height="18" rx="4" opacity="0.4"/>
        <rect x="352" y="128" width="18" height="18" rx="4" opacity="0.2"/>
        <rect x="376" y="128" width="18" height="18" rx="4" opacity="0.2"/>
        <rect x="400" y="128" width="18" height="18" rx="4" opacity="0.4"/>
        <rect x="424" y="128" width="18" height="18" rx="4" opacity="0.2"/>
        <rect x="448" y="128" width="18" height="18" rx="4" opacity="0.2"/>
      </g>
      <g opacity="0.16">
        <rect x="280" y="152" width="18" height="18" rx="4"/>
        <rect x="304" y="152" width="18" height="18" rx="4" opacity="0.4"/>
        <rect x="328" y="152" width="18" height="18" rx="4" opacity="0.2"/>
        <rect x="352" y="152" width="18" height="18" rx="4" opacity="0.4"/>
        <rect x="376" y="152" width="18" height="18" rx="4" opacity="0.2"/>
        <rect x="400" y="152" width="18" height="18" rx="4" opacity="0.2"/>
        <rect x="424" y="152" width="18" height="18" rx="4" opacity="0.4"/>
        <rect x="448" y="152" width="18" height="18" rx="4" opacity="0.2"/>
      </g>
    </g>

    <text x="8" y="205" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="12" fill="#59626D">source</text>
    <text x="280" y="205" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="12" fill="#59626D">bytecode</text>
  </g>

  <!-- embers -->
  <g fill="#FFB347">
    <circle cx="122" cy="256" r="2.2" opacity="0.5"/>
    <circle cx="96"  cy="228" r="1.6" opacity="0.35"/>
    <circle cx="140" cy="212" r="1.2" opacity="0.3"/>
    <circle cx="76"  cy="196" r="1.8" opacity="0.25"/>
    <circle cx="1216" cy="60" r="1.6" opacity="0.3"/>
    <circle cx="1240" cy="284" r="2" opacity="0.25"/>
  </g>
</svg>
